<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskflow — multi-board task manager</title>
<meta name="description" content="A multi-board drag-and-drop task manager built with React.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161320; --paper:#f8f6f3; --paper-dim:#efeae3; --line:#e0d9cf;
    --text:#1c1a22; --text-soft:#5d5768; --accent:#6e56ff; --accent-soft:#efe9ff;
    --surface:#ffffff; --danger:#ff6a5e; --success:#2fb774;
    --p-low:#5da8ff; --p-med:#ffb238; --p-high:#ff6a5e;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); background:var(--paper); color:var(--text); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding:18px 32px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  .header-left{display:flex; align-items:center; gap:22px;}
  header h1{font-family:var(--font-display); font-size:1.15rem; margin:0;}
  .boards{display:flex; gap:6px; background:var(--paper-dim); padding:4px; border-radius:100px;}
  .boards button{
    border:none; background:none; padding:7px 16px; border-radius:100px; font-size:0.85rem;
    color:var(--text-soft); cursor:pointer;
  }
  .boards button.active{background:var(--surface); color:var(--text); font-weight:500; box-shadow:0 1px 3px rgba(20,20,30,0.08);}
  .header-right a{font-size:0.85rem; color:var(--text-soft); text-decoration:none;}
  .header-right a:hover{color:var(--text);}

  .board-wrap{max-width:1120px; margin:0 auto; padding:36px 24px 60px;}
  .board{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;}
  .column{background:var(--paper-dim); border-radius:12px; padding:16px; min-height:340px; display:flex; flex-direction:column;}
  .column-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .column-head h2{font-size:0.95rem; font-weight:600; margin:0;}
  .count{font-family:var(--font-mono); font-size:0.75rem; color:var(--text-soft); background:var(--surface); padding:2px 8px; border-radius:100px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:10px; cursor:grab; font-size:0.9rem;
    box-shadow:0 1px 2px rgba(20,20,30,0.04);
  }
  .card.dragging{opacity:0.4;}
  .card-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .card-text{flex:1; outline:none; word-break:break-word;}
  .card-text[contenteditable="true"]:focus{background:var(--accent-soft); border-radius:4px; padding:1px 4px; margin:-1px -4px;}
  .card button.del{background:none; border:none; color:var(--text-soft); cursor:pointer; font-size:0.95rem; line-height:1; padding:0; flex-shrink:0;}
  .card button.del:hover{color:var(--danger);}
  .card-meta{display:flex; align-items:center; gap:6px; margin-top:9px;}
  .prio{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .prio-low{background:var(--p-low);}
  .prio-med{background:var(--p-med);}
  .prio-high{background:var(--p-high);}
  .prio-label{font-family:var(--font-mono); font-size:0.68rem; color:var(--text-soft); text-transform:capitalize;}

  .column.drag-over{outline:2px dashed var(--accent); outline-offset:-4px;}
  .add-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .add-row input[type="text"]{
    flex:1; min-width:100px; border:1px solid var(--line); border-radius:6px; padding:9px 10px;
    font-family:var(--font-body); font-size:0.85rem; background:var(--surface);
  }
  .add-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .add-row select{
    border:1px solid var(--line); border-radius:6px; background:var(--surface);
    font-size:0.8rem; padding:0 6px; color:var(--text-soft);
  }
  .add-row button{
    border:none; background:var(--accent); color:#fff; border-radius:6px;
    padding:0 14px; font-size:0.85rem; font-weight:500; cursor:pointer;
  }
  .empty{font-size:0.8rem; color:var(--text-soft); font-style:italic; padding:8px 0;}
  @media (max-width:760px){ .board{grid-template-columns:1fr;} header{padding:14px 18px;} }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "taskflow-v2";
const COLUMN_LABELS = { todo: "To do", doing: "In progress", done: "Done" };

const DEFAULT_STATE = {
  activeBoard: "launch",
  boards: {
    launch: {
      name: "Product Launch",
      columns: {
        todo: [
          { id: "t1", text: "Wire up drag & drop", prio: "high" },
          { id: "t2", text: "Write tests", prio: "med" },
        ],
        doing: [
          { id: "t3", text: "Set up component library", prio: "med" },
        ],
        done: [
          { id: "t4", text: "Design onboarding flow", prio: "low" },
        ],
      },
    },
    personal: {
      name: "Personal",
      columns: {
        todo: [
          { id: "p1", text: "Book dentist appointment", prio: "low" },
        ],
        doing: [
          { id: "p2", text: "Learn TypeScript basics", prio: "med" },
        ],
        done: [
          { id: "p3", text: "Renew gym membership", prio: "low" },
        ],
      },
    },
  },
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return DEFAULT_STATE;
}

function Card({ task, columnId, onDragStart, onDelete, onEdit, onPrioChange }) {
  const ref = useRef(null);

  function handleBlur() {
    const newText = ref.current.innerText.trim();
    if (newText && newText !== task.text) onEdit(columnId, task.id, newText);
    else ref.current.innerText = task.text;
  }

  return (
    <div className="card" draggable onDragStart={(e) => onDragStart(e, task.id, columnId)}>
      <div className="card-row">
        <span
          className="card-text"
          contentEditable
          suppressContentEditableWarning
          ref={ref}
          onBlur={handleBlur}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); ref.current.blur(); } }}
        >{task.text}</span>
        <button className="del" aria-label="Delete task" onClick={() => onDelete(columnId, task.id)}>×</button>
      </div>
      <div className="card-meta">
        <select
          value={task.prio}
          onChange={(e) => onPrioChange(columnId, task.id, e.target.value)}
          style={{border:'none', background:'none', fontFamily:'var(--font-mono)', fontSize:'0.68rem', color:'var(--text-soft)'}}
        >
          <option value="low">● Low</option>
          <option value="med">● Med</option>
          <option value="high">● High</option>
        </select>
      </div>
    </div>
  );
}

function Column({ id, tasks, onDrop, onDragStart, onDelete, onAdd, onEdit, onPrioChange }) {
  const [isOver, setIsOver] = useState(false);
  const [text, setText] = useState("");
  const [prio, setPrio] = useState("med");

  function handleAdd(e) {
    e.preventDefault();
    if (!text.trim()) return;
    onAdd(id, text.trim(), prio);
    setText("");
  }

  return (
    <div
      className={"column" + (isOver ? " drag-over" : "")}
      onDragOver={(e) => { e.preventDefault(); setIsOver(true); }}
      onDragLeave={() => setIsOver(false)}
      onDrop={(e) => { setIsOver(false); onDrop(e, id); }}
    >
      <div className="column-head">
        <h2>{COLUMN_LABELS[id]}</h2>
        <span className="count">{tasks.length}</span>
      </div>

      {tasks.length === 0 && <p className="empty">Drop a task here</p>}

      {tasks.map((task) => (
        <Card key={task.id} task={task} columnId={id} onDragStart={onDragStart} onDelete={onDelete} onEdit={onEdit} onPrioChange={onPrioChange} />
      ))}

      <form className="add-row" onSubmit={handleAdd}>
        <input type="text" placeholder="Add a task…" value={text} onChange={(e) => setText(e.target.value)} />
        <select value={prio} onChange={(e) => setPrio(e.target.value)}>
          <option value="low">Low</option>
          <option value="med">Med</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add</button>
      </form>
    </div>
  );
}

function App() {
  const [state, setState] = useState(loadState);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }, [state]);

  const board = state.boards[state.activeBoard];
  const [dragInfo, setDragInfo] = useState(null);

  function updateColumns(fn) {
    setState((prev) => ({
      ...prev,
      boards: {
        ...prev.boards,
        [prev.activeBoard]: {
          ...prev.boards[prev.activeBoard],
          columns: fn(prev.boards[prev.activeBoard].columns),
        },
      },
    }));
  }

  function handleDragStart(e, taskId, fromColumn) {
    setDragInfo({ taskId, fromColumn });
  }

  function handleDrop(e, toColumn) {
    e.preventDefault();
    if (!dragInfo) return;
    const { taskId, fromColumn } = dragInfo;
    if (fromColumn === toColumn) { setDragInfo(null); return; }
    updateColumns((cols) => {
      const task = cols[fromColumn].find((t) => t.id === taskId);
      if (!task) return cols;
      return {
        ...cols,
        [fromColumn]: cols[fromColumn].filter((t) => t.id !== taskId),
        [toColumn]: [...cols[toColumn], task],
      };
    });
    setDragInfo(null);
  }

  function handleDelete(columnId, taskId) {
    updateColumns((cols) => ({ ...cols, [columnId]: cols[columnId].filter((t) => t.id !== taskId) }));
  }

  function handleAdd(columnId, text, prio) {
    updateColumns((cols) => ({ ...cols, [columnId]: [...cols[columnId], { id: "t" + Date.now(), text, prio }] }));
  }

  function handleEdit(columnId, taskId, newText) {
    updateColumns((cols) => ({
      ...cols,
      [columnId]: cols[columnId].map((t) => t.id === taskId ? { ...t, text: newText } : t),
    }));
  }

  function handlePrioChange(columnId, taskId, prio) {
    updateColumns((cols) => ({
      ...cols,
      [columnId]: cols[columnId].map((t) => t.id === taskId ? { ...t, prio } : t),
    }));
  }

  function handleReset() {
    setState(DEFAULT_STATE);
  }

  return (
    <React.Fragment>
      <header>
        <div className="header-left">
          <h1>Taskflow</h1>
          <div className="boards">
            {Object.keys(state.boards).map((bid) => (
              <button
                key={bid}
                className={bid === state.activeBoard ? "active" : ""}
                onClick={() => setState((prev) => ({ ...prev, activeBoard: bid }))}
              >{state.boards[bid].name}</button>
            ))}
          </div>
        </div>
        <div className="header-right">
          <a href="#" onClick={(e) => { e.preventDefault(); handleReset(); }}>Reset all boards</a>
        </div>
      </header>
      <div className="board-wrap">
        <div className="board">
          {Object.keys(board.columns).map((columnId) => (
            <Column
              key={columnId}
              id={columnId}
              tasks={board.columns[columnId]}
              onDrop={handleDrop}
              onDragStart={handleDragStart}
              onDelete={handleDelete}
              onAdd={handleAdd}
              onEdit={handleEdit}
              onPrioChange={handlePrioChange}
            />
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
